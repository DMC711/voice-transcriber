<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Transcriber">
  <title>Voice Transcriber</title>
  <style>
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --card-alt: #2c2c2e;
      --accent: #0a84ff;
      --danger: #ff453a;
      --text: #ffffff;
      --subtext: #8e8e93;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px);
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0; }
    #status { font-size: 13px; color: var(--subtext); margin-top: 4px; }
    .controls { display: flex; gap: 12px; margin-bottom: 16px; }
    button {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-rec { background-color: var(--danger); color: white; }
    .btn-stop { background-color: var(--card-alt); color: white; display: none; }
    .btn-action { background-color: var(--card-alt); color: var(--accent); padding: 10px 14px; font-size: 14px; }
    textarea {
      width: 100%;
      height: 140px;
      background-color: var(--card);
      border: 1px solid var(--card-alt);
      border-radius: 12px;
      padding: 12px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.4;
      resize: none;
      margin-bottom: 12px;
    }
    .action-row { display: flex; gap: 8px; margin-bottom: 24px; }
    h2 { font-size: 16px; color: var(--subtext); margin: 0 0 10px; font-weight: 500; }
    #history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .history-card {
      background-color: var(--card);
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
    }
    .history-meta { font-size: 11px; color: var(--subtext); margin-bottom: 6px; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <header>
    <h1>Voice Transcriber</h1>
    <div id="status">Ready</div>
  </header>

  <div class="controls">
    <button id="recBtn" class="btn-rec" onclick="startRecording()">
      <span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:#fff;"></span>
      Record
    </button>
    <button id="stopBtn" class="btn-stop" onclick="stopRecording()">
      <span style="display:inline-block; width:12px; height:12px; background:#fff;"></span>
      Stop
    </button>
  </div>

  <textarea id="liveText" placeholder="Spoken words will appear here instantly..."></textarea>

  <div class="action-row">
    <button class="btn-action" onclick="copyCurrent()">Copy Text</button>
    <button class="btn-action" onclick="exportFile('md')">Export .MD</button>
    <button class="btn-action" onclick="exportFile('txt')">Export .TXT</button>
  </div>

  <h2>Saved Notes</h2>
  <div id="history"></div>

  <script>
    let recognition = null;
    let wakeLock = null;
    let finalTranscript = '';
    const silentAudio = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
    silentAudio.loop = true;

    // Check speech support
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function initSpeech() {
      if (!SpeechRecognition) {
        document.getElementById('status').innerText = 'Speech recognition not supported on this browser';
        return null;
      }
      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = 'en-US';

      rec.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + ' ';
          } else {
            interim += event.results[i][0].transcript;
          }
        }
        document.getElementById('liveText').value = finalTranscript + interim;
      };

      rec.onerror = (e) => {
        document.getElementById('status').innerText = 'Error: ' + e.error;
      };

      rec.onend = () => {
        if (document.getElementById('stopBtn').style.display === 'flex') {
          // Keep active if recording wasn't manually stopped
          try { rec.start(); } catch(_) {}
        }
      };

      return rec;
    }

    async function startRecording() {
      finalTranscript = '';
      document.getElementById('liveText').value = '';

      if (!recognition) recognition = initSpeech();
      if (!recognition) return;

      try {
        silentAudio.play().catch(() => {});
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (_) {}

      try {
        recognition.start();
        document.getElementById('recBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'flex';
        document.getElementById('status').innerText = 'Listening...';
      } catch (err) {
        document.getElementById('status').innerText = 'Mic permission needed';
      }
    }

    function stopRecording() {
      if (recognition) recognition.stop();
      silentAudio.pause();
      if (wakeLock) { wakeLock.release(); wakeLock = null; }

      document.getElementById('recBtn').style.display = 'flex';
      document.getElementById('stopBtn').style.display = 'none';
      document.getElementById('status').innerText = 'Ready';

      const result = document.getElementById('liveText').value.trim();
      if (result) saveToStorage(result);
    }

    function saveToStorage(text) {
      const notes = JSON.parse(localStorage.getItem('notes') || '[]');
      notes.unshift({ text: text, date: new Date().toLocaleString() });
      localStorage.setItem('notes', JSON.stringify(notes));
      renderHistory();
    }

    function renderHistory() {
      const notes = JSON.parse(localStorage.getItem('notes') || '[]');
      const container = document.getElementById('history');
      container.innerHTML = notes.map(n => `
        <div class="history-card">
          <div class="history-meta">
            <span>${n.date}</span>
            <span style="color:var(--accent); cursor:pointer;" onclick="navigator.clipboard.writeText('${n.text.replace(/'/g, "\\'")}')">Copy</span>
          </div>
          <div>${n.text}</div>
        </div>
      `).join('');
    }

    function copyCurrent() {
      const text = document.getElementById('liveText').value;
      if (text) {
        navigator.clipboard.writeText(text);
        document.getElementById('status').innerText = 'Copied to clipboard!';
        setTimeout(() => document.getElementById('status').innerText = 'Ready', 2000);
      }
    }

    function exportFile(type) {
      const text = document.getElementById('liveText').value;
      if (!text) return;
      const stamp = new Date().toISOString().replace(/[:.]/g, '-');
      const blob = new Blob([text], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `note-${stamp}.${type}`;
      a.click();
    }

    renderHistory();
  </script>
</body>
</html>
